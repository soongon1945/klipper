# Test config with dual carriage and multiple extruders
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[dual_carriage]
axis: x
step_pin: PH1
dir_pin: PH0
enable_pin: !PA1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE4
position_endstop: 200
position_max: 200
homing_speed: 50
# Exercise collision limits independently from the two rails' travel limits.
safe_distance: 40

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[probe]
pin: ^PE3
z_offset: 1.0
# SAVE_CONFIG writes these values; startup must restore the E1 alignment.
e_x_offset: 0.61
e_y_offset: 2.36
e_z_offset: 0.06

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[gcode_macro PARK_extruder]
gcode:
    G90
    G1 X0

[gcode_macro T0]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    PARK_{printer.toolhead.extruder}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    SET_DUAL_CARRIAGE CARRIAGE=0

[extruder1]
step_pin: PC1
dir_pin: PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK7
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[gcode_macro PARK_extruder1]
gcode:
    SET_SERVO SERVO=my_servo angle=100
    G90
    # Leave room for the positive E1 X offset at the physical rail maximum.
    G1 X190

[gcode_macro T1]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    PARK_{printer.toolhead.extruder}
    SET_SERVO SERVO=my_servo angle=50
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    SET_DUAL_CARRIAGE CARRIAGE=1

[gcode_macro ASSERT_E1_OFFSET_LOADED]
gcode:
    {% set offset = printer.gcode_move.offset_position %}
    {% if (offset.x - 0.61)|abs > 0.000001
          or (offset.y - 2.36)|abs > 0.000001
          or (offset.z - 0.06)|abs > 0.000001 %}
        {action_raise_error("E1 offsets were not restored from [probe]")}
    {% endif %}

[gcode_macro ASSERT_IDEX_TOOL]
gcode:
    {% set carriage = params.CARRIAGE|int %}
    {% if printer.toolhead.extruder != params.EXTRUDER
          or printer.extruder.motion_queue != "extruder"
          or printer.extruder1.motion_queue != "extruder1" %}
        {action_raise_error("IDEX carriage, tool, or E queue is inconsistent")}
    {% endif %}
    {% if carriage == 0
          and (printer.dual_carriage.carriage_0 != "PRIMARY"
               or printer.dual_carriage.carriage_1 != "INACTIVE") %}
        {action_raise_error("T0 carriage state is inconsistent")}
    {% endif %}
    {% if carriage == 1
          and (printer.dual_carriage.carriage_1 != "PRIMARY"
               or printer.dual_carriage.carriage_0 != "INACTIVE") %}
        {action_raise_error("T1 carriage state is inconsistent")}
    {% endif %}

[gcode_macro ASSERT_GCODE_MODE]
gcode:
    {% set expected_absolute = params.ABSOLUTE|int == 1 %}
    {% if printer.gcode_move.absolute_coordinates != expected_absolute %}
        {action_raise_error("RECORD_GCODE_STATE changed G90/G91 mode")}
    {% endif %}

[gcode_macro ASSERT_GCODE_SPEED]
gcode:
    {% if (printer.gcode_move.speed - params.EXPECTED|float)|abs > 0.000001 %}
        {action_raise_error("RECORD_GCODE_STATE changed modal feed rate")}
    {% endif %}

[gcode_macro ASSERT_GCODE_X]
gcode:
    {% if (printer.gcode_move.gcode_position.x
           - params.EXPECTED|float)|abs > 0.000001 %}
        {action_raise_error("G28 left the wrong IDEX X origin")}
    {% endif %}

[gcode_macro ASSERT_GCODE_Z]
gcode:
    {% set logical = printer.gcode_move.gcode_position.z %}
    {% set physical = printer.gcode_move.position.z %}
    {% if (logical - params.LOGICAL|float)|abs > 0.000001
          or (physical - params.PHYSICAL|float)|abs > 0.000001 %}
        {action_raise_error("RECORD_GCODE_STATE restored the wrong Z basis")}
    {% endif %}

[servo my_servo]
pin: PH4

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
