[include dual_carriage.cfg]

# Production G28 wrappers must align carriage, active tool, and E queues without
# calling a parking macro while the pre-home tool still references carriage 1.
[gcode_macro _IDEX_SELECT_T0_AFTER_HOME]
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    ACTIVATE_EXTRUDER EXTRUDER=extruder

[homing_override]
axes: x
gcode:
    {% set restore_relative = not printer.gcode_move.absolute_coordinates %}
    G28 {rawparams}
    _IDEX_SELECT_T0_AFTER_HOME
    {% if restore_relative %}G91{% endif %}
