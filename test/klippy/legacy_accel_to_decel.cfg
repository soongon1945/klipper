[include ../../config/example-cartesian.cfg]

[printer]
max_accel_to_decel: 1200

[gcode_macro ASSERT_VELOCITY_LIMIT]
gcode:
    {% set toolhead = printer.toolhead %}
    {% set expected_accel = params.ACCEL|float %}
    {% set expected_ratio = params.RATIO|float %}
    {% set expected_legacy = params.LEGACY|float %}
    {% if (toolhead.max_accel|float - expected_accel)|abs > 0.000001
          or (toolhead.minimum_cruise_ratio|float
              - expected_ratio)|abs > 0.000001
          or (toolhead.max_accel_to_decel|float
              - expected_legacy)|abs > 0.000001 %}
        {action_raise_error("Unexpected velocity limit state")}
    {% endif %}
